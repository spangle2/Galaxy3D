<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Universe Simulation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/FlyControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.js"></script>
</head>
<body>
    <div id="info">
        <h1>Procedural Universe</h1>
        <p>Use WASD to fly, mouse to look around, scroll to adjust speed</p>
    </div>
    
    <div id="controls">
        <div class="control">
            <label for="galaxyCount">Galaxy Count:</label>
            <input type="range" id="galaxyCount" min="1" max="20" step="1" value="5">
            <span id="galaxyCountValue">5</span>
        </div>
        <div class="control">
            <label for="density">Star Density:</label>
            <input type="range" id="density" min="0.1" max="2" step="0.1" value="1">
            <span id="densityValue">1</span>
        </div>
        <div class="control">
            <label for="showLabels">Show Labels:</label>
            <input type="checkbox" id="showLabels" checked>
        </div>
        <button id="generateNew">Generate New Universe</button>
        <button id="toggleView">Toggle View Mode</button>
        <div id="infoPanel">
            <h3>Current Location</h3>
            <div id="locationInfo">Universe Overview</div>
        </div>
    </div>
    
    <div id="container"></div>
    <script src="app.js"></script>
</body>
</html>
